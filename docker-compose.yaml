services:
  paperpilot:
    image: ifzzh520/paperpilot:0.6.0
    container_name: paperpilot
    ports:
      - "127.0.0.1:7191:7191"
    env_file:
      - /mnt/raid1/projects/paperpilot/deploy/.env
    environment:
      PAPERPILOT_ENV: ${PAPERPILOT_ENV:-production}
      PAPERPILOT_AUTH_MODE: ${PAPERPILOT_AUTH_MODE:-supabase}
      PAPERPILOT_COOKIE_SECURE: ${PAPERPILOT_COOKIE_SECURE:-true}
      PAPERPILOT_TRANSLATION_WORKER_URL: http://paperpilot-translation-worker:7192
      PAPERPILOT_TRANSLATION_JOBS_ROOT: /work/jobs
      PAPERPILOT_WORKER_TOKEN_FILE: /run/secrets/paperpilot_worker_token
      PAPERPILOT_SETTINGS_KEY_FILE: /run/secrets/paperpilot_settings_key
      PAPERPILOT_AI_ALLOWED_ORIGINS: ${PAPERPILOT_AI_ALLOWED_ORIGINS:-}
      PAPERPILOT_AI_PRIVATE_ALLOWED_ORIGINS: ${PAPERPILOT_AI_PRIVATE_ALLOWED_ORIGINS:-}
      PAPERPILOT_MINERU_TRANSFER_ALLOWED_ORIGINS: ${PAPERPILOT_MINERU_TRANSFER_ALLOWED_ORIGINS:-}
    volumes:
      - /mnt/raid1/projects/paperpilot/deploy/.env:/app/.env:ro
      - /srv/ifserver-fast/paperpilot/runtime/db:/app/db
      - /mnt/raid1/projects/paperpilot/data/papers:/data/papers
      - /mnt/raid1/projects/paperpilot/data/staging/translation:/work/jobs
    secrets:
      - paperpilot_worker_token
      - source: paperpilot_settings_key
        target: paperpilot_settings_key
        uid: "10001"
        gid: "1001"
        mode: 0440
    depends_on:
      paperpilot-translation-worker:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  paperpilot-translation-worker:
    image: ifzzh520/paperpilot:0.6.0-worker
    container_name: paperpilot-translation-worker
    environment:
      PAPERPILOT_WORKER_JOBS_ROOT: /work/jobs
      PAPERPILOT_WORKER_TOKEN_FILE: /run/secrets/paperpilot_worker_token
    volumes:
      - /mnt/raid1/projects/paperpilot/data/staging/translation:/work/jobs
    secrets:
      - paperpilot_worker_token
    expose:
      - "7192"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 4.0
    mem_limit: 6g
    pids_limit: 256
    stop_grace_period: 15s
    restart: unless-stopped

secrets:
  paperpilot_worker_token:
    file: /mnt/raid1/projects/paperpilot/deploy/paperpilot-worker.token
  paperpilot_settings_key:
    file: /mnt/raid1/projects/paperpilot/deploy/paperpilot-settings.key
