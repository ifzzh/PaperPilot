<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ paper_title or 'PDF Viewer' }} - PaperPilot</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/website_logo.svg') }}">
    <link rel="alternate icon" type="image/png" href="{{ url_for('static', filename='images/website_logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}?v=6.0.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-purple.css') }}">
    <script src="{{ url_for('static', filename='js/i18n_zh_cn.js') }}?v=0.10.2"></script>
    <script src="{{ url_for('static', filename='js/page_actions.js') }}?v=0.11.0"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #2c2c2c;
            color: white;
            overflow: hidden;
        }
        
        .header {
            background: #1a1a1a;
            border-bottom: 1px solid #444;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        
        .header h3 {
            margin: 0;
            font-size: 16px;
            color: white;
        }
        
        .btn {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background-color 0.2s;
        }
        
        .btn:hover {
            background: #0056b3;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #545b62;
        }
        
        .pdf-container {
            height: calc(100vh - 60px);
            width: 100%;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
            color: #ccc;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #444;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body data-paper-id="{{ paper_id|e }}" data-use-chinese="{{ 'true' if use_chinese else 'false' }}">
    <script src="{{ url_for('static', filename='js/api_auth_patch.js') }}?v=0.10.2"></script>
    <div class="header">
        <div>
            <button id="back-btn" class="btn btn-secondary" title="Close current tab (Ctrl+W)">
                <i class="fas fa-times"></i> Close
            </button>
        </div>
        <h3 id="pdf-title">{{ paper_title or 'PDF Viewer' }}</h3>
        <div>
            <a href="/api/paper/{{ paper_id }}/file" class="btn btn-secondary" download>
                <i class="fas fa-download"></i> Download
            </a>
        </div>
    </div>
    
    <div class="pdf-container">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading PDF viewer...</p>
        </div>
        <iframe 
            id="pdf-iframe" 
            style="display: none;"
            src=""
            title="PDF Viewer">
        </iframe>
    </div>
    
    <script src="{{ url_for('static', filename='js/pdf_viewer.js') }}?v=0.11.0"></script>
</body>
</html>
