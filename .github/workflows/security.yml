name: Security gate

on:
  pull_request:
  push:
    branches: [dev, main, personal-paper-reading]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # The test target depends on frontend-build: npm ci, typecheck, tests,
      # production assets and npm audit are mandatory before Python tests.
      - name: Build locked frontend and test environment
        run: docker build --target test --tag ipaper:v0.8-test .

      - name: Audit frontend lock against current advisories
        run: >-
          docker run --rm
          --mount type=bind,source="$PWD/frontend",target=/frontend,readonly
          --workdir /frontend node:22.23.2-bookworm-slim
          npm audit --audit-level=high

      - name: Run dependency gate
        run: ./scripts/security_scan.sh dependencies

      - name: Build final images
        run: |
          docker build --target runtime --tag ipaper:ci-web .
          docker build --target translation-worker --tag ipaper:ci-worker .
          docker build --target document-worker --tag ipaper:ci-document .

      - name: Run source and image gates
        env:
          IPAPER_WEB_IMAGE: ipaper:ci-web
          IPAPER_WORKER_IMAGE: ipaper:ci-worker
          IPAPER_DOCUMENT_IMAGE: ipaper:ci-document
        run: |
          ./scripts/security_scan.sh filesystem
          ./scripts/security_scan.sh images

      - name: Upload reports and SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ipaper-security-${{ github.sha }}
          path: /tmp/ipaper-security
          if-no-files-found: error
          retention-days: 30
